# Root workspace for the public tile-rs tree. The private root manifest cannot be
# shipped as-is: its `crates/*` glob pulls in tile_kernel_builder and
# tests/compiletest, which depend on the codegen backend crate that is not public,
# so the whole workspace fails to load and every root-level CI step fails with it.

[workspace]
members = [
    "crates/ascend_compile",
    "crates/ascend_rs",
    "crates/ascend_rs_blas",
    "crates/ascend_sys",
    "crates/tile_hal",
    "crates/tile_kernel_builder_config",
    "crates/tile_std",
    "crates/tile_std_macros",
    "tests/kernel_correctness",
    "tests/npu_correctness",
]
exclude = [
    # Carry their own [workspace]; build and test them from their own directory.
    "crates/tile_codegen",
    "crates/tile_spec",
    # Need the installed codegen backend.
    "crates/tile_kernel_builder",
    "tests/compiletest",
    # Each example builds its kernels through the codegen backend.
    "examples",
    "benchmarks",
]
resolver = "3"

[profile.dev.package.tile_std]
debug = 0

[profile.test.package.tile_std]
debug = 0

[profile.release-hardened]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
