name: Prototype PTO camodel add
on:
  push:
    branches: [prototype/59-camodel]
    paths:
      - prototypes/pto-camodel/**
      - .github/workflows/prototype-pto-camodel.yml
permissions:
  contents: read
jobs:
  add:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        program: [handwritten, generated]
    env:
      PROGRAM_MODE: ${{ matrix.program }}
      INJECT_ERROR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record clean no-device host
        run: |
          export BUILD_DIR="$RUNNER_TEMP/camodel-add"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "INSTALL_ROOT=$RUNNER_TEMP/ascend-prototype" >> "$GITHUB_ENV"
          mkdir -p "$BUILD_DIR"
          {
            uname -a
            printf 'ImageOS=%s ImageVersion=%s Runner=%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_NAME"
            lspci -nn
          } > "$BUILD_DIR/host-inventory.txt"
          python3 - <<'PY'
          import glob
          paths = [p for pattern in ('/dev/davinci*', '/dev/devmm_svm', '/dev/hisi_hdc', '/usr/local/Ascend*') for p in glob.glob(pattern)]
          print('Pre-install Ascend devices/installations:', paths)
          if paths:
              raise SystemExit('Unexpected Ascend device or installation')
          PY
      - name: Ubuntu distribution dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ make python3 python3-dev python3-pip python3-venv curl ca-certificates git libnuma1 libgomp1 libglib2.0-0 binutils
      - name: Download, verify and install full Toolkit without driver
        run: bash prototypes/pto-camodel/install.sh
      - name: Compile real A2 vector kernel and compare camodel output
        run: bash prototypes/pto-camodel/run.sh
      - name: Preserve only owned source, numeric data and necessary inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pto-camodel-${{ matrix.program }}
          path: |
            ${{ runner.temp }}/camodel-add/host-inventory.txt
            ${{ runner.temp }}/camodel-add/inventory.txt
            ${{ runner.temp }}/camodel-add/input.pto
            ${{ runner.temp }}/camodel-add/generated.cpp
            ${{ runner.temp }}/camodel-add/kernel.cpp
            ${{ runner.temp }}/camodel-add/host.cpp
            ${{ runner.temp }}/camodel-add/check.py
            ${{ runner.temp }}/camodel-add/inputs.txt
            ${{ runner.temp }}/camodel-add/outputs.txt
            ${{ runner.temp }}/camodel-add/result.txt
          retention-days: 14
