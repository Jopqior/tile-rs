# Temporary probe: published macOS backend -> real Rust kernel MLIR -> open PTO emitter.
name: prototype-rust-pto-frontend
on:
  push:
    branches: [prototype/rust-pto-ascend-ci]
    paths:
      - 'prototypes/rust-pto-ascend/frontend/**'
      - '.github/workflows/prototype-rust-pto-frontend.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: macos-14 # Apple silicon; the v0.0.2 backend is released only for aarch64-apple-darwin
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set isolated paths for this runner
        run: |
          echo "PROBE_DIR=$RUNNER_TEMP/rust-pto-frontend" >> "$GITHUB_ENV"
          echo "TILE_HOME=$RUNNER_TEMP/tile-home" >> "$GITHUB_ENV"
          echo "TILE_STD_PATH=$GITHUB_WORKSPACE/crates/tile_std" >> "$GITHUB_ENV"
      - name: Install exact backend-compatible nightly
        run: |
          rustup toolchain install nightly-2025-08-04 --profile minimal --component rustc-dev --component llvm-tools --component rust-src
          rustc +nightly-2025-08-04 --version
      - name: Build current CLI on stable, install checksum-verified published backend
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cargo +stable build --locked --release --manifest-path crates/tile_cli/Cargo.toml --bin tile
          crates/tile_cli/target/release/tile install rustc_codegen_tile
      - name: Work around CLI-injected duplicate attributes in a scratch tile_std copy
        run: |
          set -euo pipefail
          overlay="$RUNNER_TEMP/tile-std-overlay"
          mkdir -p "$overlay"
          cp -R crates/tile_std crates/tile_std_macros "$overlay/"
          # lower_rs.rs injects register_tool via -Zcrate-attr for every target crate;
          # tile_std/src/lib.rs also declares it and nightly rejects the duplicate
          # (E0636). Keep the checked-out source untouched, remove ONLY the two
          # duplicated declarations in a throwaway copy, and use that as TILE_STD_PATH.
          python3 - "$overlay/tile_std/src/lib.rs" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          for line in ('    register_tool\n', '#![register_tool(tile)]\n'):
              if source.count(line) != 1:
                  raise SystemExit(f'expected one occurrence of {line!r}, got {source.count(line)}')
              source = source.replace(line, '')
          path.write_text(source)
          PY
          mkdir -p "$PROBE_DIR"
          # Preserve the exact adjustment alongside compiler outputs, not only this recipe.
          set +e
          diff -u crates/tile_std/src/lib.rs "$overlay/tile_std/src/lib.rs" \
            > "$PROBE_DIR/tile_std-attr-dedup.diff"
          diff_status=$?
          set -e
          test "$diff_status" -eq 1
          printf '%s\n' \
            'Pristine checkout failed before kernel lowering (rustc E0636, duplicate register_tool):' \
            'https://github.com/Jopqior/tile-rs/actions/runs/36335776434' \
            'This run compiles a scratch COPY of tile_std with only the two duplicated crate attributes removed.' \
            'See tile_std-attr-dedup.diff; current checkout, released backend, and Rust kernel are unmodified.' \
            > "$PROBE_DIR/PROVENANCE.txt"
          echo "TILE_STD_PATH=$overlay/tile_std" >> "$GITHUB_ENV"
      - name: Compile Rust with the actual backend and emit current-source PTO
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_DIR"
          tile=crates/tile_cli/target/release/tile
          # Diagnostic only: the shipped softmax currently reaches the real backend,
          # then fails its MSL lowering at unsupported __tile_window_mask_f32. Keep
          # that refusal visible; require the exact known failure or successful MLIR.
          if env -u RUSTFLAGS "$tile" crates/tile_cli/testdata/forms/softmax.rs -t msl \
            --keep-dir "$PROBE_DIR/sample" -o "$PROBE_DIR/sample.metal" \
            2>&1 | tee "$PROBE_DIR/sample.log"; then
            test -s "$PROBE_DIR/sample/softmax.1.mlir.mlir"
          else
            grep -q 'mlir_to_msl has no arm for `__tile_window_mask_f32`' "$PROBE_DIR/sample.log"
            echo 'Known shipped-sample MSL refusal recorded in sample.log; probing minimal add kernel.'
          fi
          # The released Metal path refuses even this minimal add because it audits
          # __tile_window_mask_f32 in tile_std. Try the backend's PTO path directly;
          # only its compiler-produced kept intermediate may feed the open PTO emitter.
          env -u RUSTFLAGS "$tile" prototypes/rust-pto-ascend/frontend/add_generated.rs -t pto \
            --keep-dir "$PROBE_DIR/kernel" -o "$PROBE_DIR/add_generated.backend.pto.mlir" \
            2>&1 | tee "$PROBE_DIR/kernel.log"
          cp "$PROBE_DIR/kernel/add_generated.1.mlir.mlir" "$PROBE_DIR/add_generated.mlir"
          test -s "$PROBE_DIR/add_generated.mlir"
          # Explicit second invocation: force the open, current-source PTO emitter to run,
          # rather than accepting the proprietary backend's optional target_source.
          "$tile" "$PROBE_DIR/add_generated.mlir" -t pto -o "$PROBE_DIR/add_generated.pto.mlir" \
            2>&1 | tee "$PROBE_DIR/pto.log"
          test -s "$PROBE_DIR/add_generated.pto.mlir"
          grep -q '__tile_add_f32' "$PROBE_DIR/add_generated.mlir"
          (cd "$PROBE_DIR" && shasum -a 256 add_generated.mlir add_generated.pto.mlir \
            | tee SHA256SUMS)
          printf 'Backend: v0.0.2+nightly-2025-08-04 (verified by tile install)\n'
          printf 'MLIR and PTO emitted from %s\n' "$(git rev-parse HEAD)"
          printf '\nCompiler MLIR:\n'; head -100 "$PROBE_DIR/add_generated.mlir"
          printf '\nPTO:\n'; head -120 "$PROBE_DIR/add_generated.pto.mlir"
      - name: Preserve evidence even on failed compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-pto-frontend-${{ runner.os }}-${{ github.sha }}
          path: ${{ env.PROBE_DIR }}/
          if-no-files-found: warn
