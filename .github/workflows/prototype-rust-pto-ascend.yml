name: Rust PTO Ascend
on:
  push:
    branches: [prototype/61-rust-pto-ascend-ci]
    paths:
      - '.github/workflows/prototype-rust-pto-*.yml'
      - 'prototypes/rust-pto-ascend/cases/**'
      - 'prototypes/rust-pto-ascend/frontend/**'
      - 'prototypes/rust-pto-ascend/device/**'
  pull_request:
    paths:
      - '.github/workflows/prototype-rust-pto-*.yml'
      - 'prototypes/rust-pto-ascend/cases/**'
      - 'prototypes/rust-pto-ascend/frontend/**'
      - 'prototypes/rust-pto-ascend/device/**'
  workflow_dispatch:
    inputs:
      run_npu:
        description: Run on an authorized, registered Ascend910B runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    name: Offline suite tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Test frontend and device runners without SDKs
        run: |
          python3 -m unittest discover -s prototypes/rust-pto-ascend/frontend/tests -v
          python3 -m unittest discover -s prototypes/rust-pto-ascend/device/tests -v
      - name: Check shell scripts
        run: |
          shellcheck prototypes/rust-pto-ascend/device/*.sh
  frontend:
    if: github.event_name != 'pull_request'
    needs: tests
    uses: ./.github/workflows/prototype-rust-pto-frontend.yml
  simulator:
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ASCEND_DEVICE_ID: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-pto-frontend-macOS-${{ github.sha }}
          path: frontend
      - name: Set isolated directories
        run: |
          echo "BUILD_DIR=$RUNNER_TEMP/rust-pto-sim" >> "$GITHUB_ENV"
          echo "INSTALL_ROOT=$RUNNER_TEMP/ascend-prototype" >> "$GITHUB_ENV"
          echo "CANN_ENV=$RUNNER_TEMP/ascend-prototype/cann/set_env.sh" >> "$GITHUB_ENV"
          echo "TOOLS_DIR=$RUNNER_TEMP/rust-pto-tools" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc g++ make python3 python3-dev python3-pip python3-venv curl ca-certificates git libnuma1 libgomp1 libglib2.0-0 binutils
      - name: Install pinned CANN Toolkit without driver
        run: bash prototypes/rust-pto-ascend/device/install-camodel.sh
      - name: Install pinned PTO tools
        run: bash prototypes/rust-pto-ascend/device/install-tools.sh sim "$TOOLS_DIR"
      - name: Run simulator suite
        run: |
          bash prototypes/rust-pto-ascend/device/run.sh \
            --mode sim --input "$GITHUB_WORKSPACE/frontend" \
            --output "$BUILD_DIR" --tools "$TOOLS_DIR"
      - name: Upload simulator results and generated sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-pto-device-input
          path: ${{ env.BUILD_DIR }}/artifacts/
          if-no-files-found: warn
          retention-days: 14
  npu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_npu }}
    needs: simulator
    runs-on: [self-hosted, linux, ascend-910b]
    timeout-minutes: 30
    concurrency:
      group: ascend-910b-device
      cancel-in-progress: false
    env:
      CANN_ENV: ${{ vars.ASCEND_CANN_ENV }}
      ASCEND_DEVICE_ID: ${{ vars.ASCEND_DEVICE_ID }}
      ASCEND_SOC: ${{ vars.ASCEND_SOC }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-pto-device-input
          path: device-input
      - name: Set isolated directories
        run: |
          echo "BUILD_DIR=$RUNNER_TEMP/rust-pto-npu-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "TOOLS_DIR=$RUNNER_TEMP/rust-pto-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install pinned PTO headers
        run: bash prototypes/rust-pto-ascend/device/install-tools.sh npu "$TOOLS_DIR"
      - name: Run NPU suite using the same generated sources
        run: |
          bash prototypes/rust-pto-ascend/device/run.sh \
            --mode npu --input "$GITHUB_WORKSPACE/device-input" \
            --output "$BUILD_DIR" --tools "$TOOLS_DIR"
      - name: Upload NPU results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-pto-npu
          path: ${{ env.BUILD_DIR }}/artifacts/
          if-no-files-found: warn
          retention-days: 14
