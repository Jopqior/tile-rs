name: coverage

# Line-coverage gate for the crates that build with no LLVM or CANN toolchain:
# tile_codegen with the Metal emitter, tile_hal, tile_std_macros and the
# tile_spec scenarios. Other backends ship in the prebuilt codegen backend.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Slim rust-toolchain.toml for CI
        run: |
          cat > rust-toolchain.toml << 'TOML'
          [toolchain]
          channel = "nightly-2025-08-04"
          components = ["rustc", "cargo", "llvm-tools"]
          TOML

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage gate
        # Measured total 64.51% (16,028 of 24,844 gated lines); the Metal
        # emitter's dispatch logic is most of that surface at 63%. The canned
        # per-kernel Metal emitters are printed but not gated. 62 leaves two
        # points of headroom.
        run: bash scripts/coverage.sh --gate 62
