name: toolchain-drift

# Guards the #![no_core] `tile_std` surface against silent toolchain drift.
#
# tile_std hooks directly into compiler internals (lang items, rustc_* attributes,
# intrinsics), so it is sensitive to the exact nightly. crates/tile_std/build.rs reads
# rustc's commit date and sets one cfg per compiler change (`d >= (Y, M, D)`), so one
# source tree builds across the whole supported range. All three jobs run
# scripts/nightly_drift_check.py:
#
#   pinned-build    `cargo build -p tile_std` on the pinned nightly in rust-toolchain.toml.
#   latest-check    `cargo check -p tile_std` on the newest published nightly. A failure
#                   is a new compiler change to port: bisect it to its nightly with
#                   `--bisect GOOD BAD --signature '<error text>'` and add a gate at
#                   the date it reports.
#   gate-boundaries `cargo check` on the nightlies on either side of every gate date in
#                   build.rs, confirming each cfg is off the day before and on the day
#                   of. A gate with the wrong date breaks every nightly between the right
#                   date and the wrong one, which neither job above can see.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so breakage from new nightlies surfaces even without a push.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pinned-build:
    name: tile_std builds on the pinned nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build tile_std on the pinned nightly
        run: python3 scripts/nightly_drift_check.py --only pinned

  latest-check:
    name: tile_std checks on the latest nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tile_std on the newest published nightly
        run: python3 scripts/nightly_drift_check.py --only latest

  gate-boundaries:
    name: tile_std checks on both sides of every build.rs gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tile_std on the nightlies around each gate date
        run: python3 scripts/nightly_drift_check.py --only gates
