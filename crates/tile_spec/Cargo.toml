[package]
name = "tile_spec"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "tile-rs executable Gherkin (Given/When/Then) spec layer: .feature use cases mapped 1:1 to step definitions that drive the open CodegenTarget trait + registry and the MLIR->source emitters registered in tile_codegen. Std-only, zero external deps (offline-vendored-registry friendly)."

# Standalone workspace, like crates/tile_codegen: this crate is `exclude`d from
# the repo-root workspace so `cd crates/tile_spec && cargo test` (and the
# coverage harness) resolve against THIS manifest. It includes no emitter
# source; the .feature steps reach the emitters through tile_codegen's registry.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# The step definitions drive the trait + registry and the Metal emitter.
tile_codegen = { path = "../tile_codegen", features = ["emitters"] }
