[package]
name = "metal_correctness"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Independent Metal correctness entry: current-source emitter to GPU readback vs PyTorch CPU."

# Standalone workspace. Excluded from the repo-root workspace so
# `cd crates/metal_correctness && cargo test` (and the macos-15 CI job)
# resolve against this manifest. The binary #[path]-includes the real
# mlir_to_msl emitter with no LLVM dep, matching tile_spec.
[workspace]

[[bin]]
name = "metal-correctness"
path = "src/main.rs"
# The path-included emitter ships its own #[cfg(test)] suite, which needs
# files this crate does not provide. Integration tests under tests/ drive
# the binary instead.
test = false
bench = false
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.33.0"
