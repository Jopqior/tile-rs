[package]
name = "tile_codegen"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "tile-rs open codegen skeleton: the CodegenTarget trait + target registry. Std-only (no LLVM/MLIR/melior/rustc deps) — the open core of tile-rs. Target backends plug in as CodegenTarget impls registered on a TargetRegistry."

# Standalone workspace: this open crate is `exclude`d from the repo root
# workspace, and an empty `[workspace]` table here makes `cd crates/tile_codegen
# && cargo test` (and `cargo llvm-cov`) resolve against THIS manifest rather than
# walking up to the repo-root workspace — which the documented standalone build
# (and the coverage harness in scripts/coverage.sh) relies on.
[workspace]

[lib]
path = "src/lib.rs"

[features]
# Default = the open, LLVM-free skeleton (trait + registry + a self-contained
# reference target). This is what builds & tests on any box, including macOS.
default = []

# `emitters` wires the open MLIR->source emitter: the Apple Metal (MSL) arm and
# the target-neutral MLIR parser it reads. Std-only, builds anywhere.
emitters = []
